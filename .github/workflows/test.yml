name: Baseline and audit regressions
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node engine.test.cjs
      - run: node hosted-feed.test.cjs
      - run: node --test experience.test.cjs server/*.test.mjs tests/*.test.cjs
