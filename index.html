<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<link rel="manifest" href="manifest.json">
<title>Institutional Radar V3</title>
<style>
:root{--bg:#0b0f16;--p:#141b26;--p2:#0f151e;--line:#293545;--txt:#edf2f7;--mut:#8f9aaa;--blue:#58a6ff;--green:#35c759;--red:#ff5b62;--orange:#ffb020;--cyan:#54d7e5}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0f16,#0d121b);color:var(--txt);font-family:Arial,sans-serif;padding:13px}
button,select{font:inherit}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{background:var(--p);border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--mut);font-size:12px}
h1{font-size:25px;margin:0}h2{font-size:21px;margin:0 0 5px}.sub{color:var(--mut);line-height:1.45;margin:5px 0 13px}
.btn{border:0;border-radius:11px;padding:11px 14px;background:#218f3e;color:white;font-weight:800}.btn2{background:var(--p);color:var(--txt);border:1px solid var(--line)}
.section{margin:21px 0 9px;font-size:19px;font-weight:900}
.card{background:linear-gradient(180deg,#151d28,#111821);border:1px solid var(--line);border-radius:17px;padding:14px;margin:10px 0}
.selector{display:flex;gap:8px}.selector select{flex:1;background:#151d28;color:var(--txt);border:1px solid #405065;border-radius:12px;padding:12px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:11px}.kpi span{display:block;color:var(--mut);font-size:12px}.kpi b{display:block;font-size:18px;margin-top:4px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #202a36}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--orange)}.neutral{color:#d4dbe3}
.tableRow{display:grid;grid-template-columns:58px 1fr 1fr 1fr 1fr 28px;gap:6px;align-items:center;padding:9px 7px;border:1px solid var(--line);background:var(--p);border-radius:11px;margin:6px 0;cursor:pointer}.tableRow b{font-size:13px}.mut{color:var(--mut);font-size:11px}.arrow{color:var(--blue);font-size:19px;text-align:right}
.signal{padding:12px;border-radius:13px;background:#0d141d;border:1px solid var(--line);margin-top:9px}.signalTitle{font-weight:900;font-size:16px}.signalText{color:#c5ced8;line-height:1.45;font-size:13px;margin-top:5px}
.bar{height:8px;background:#202a36;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--blue)}
canvas{width:100%;height:215px;display:block}.chartHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-end}.chartTitle{font-weight:900;font-size:17px}.chartSub{color:var(--mut);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:6px;overflow:auto;margin:9px 0}.tab{white-space:nowrap;background:var(--p);border:1px solid var(--line);color:var(--mut);padding:8px 10px;border-radius:999px}.tab.active{color:#fff;border-color:#4d79a8;background:#162235}
.details{display:grid;grid-template-columns:1fr 1fr;gap:7px}.box{background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:10px;font-size:12px;line-height:1.4}.box b{display:block;font-size:14px;margin-top:3px}
.click{color:var(--blue);font-size:12px;font-weight:800;margin-top:9px}.hidden{display:none!important}.danger{border-color:#6e353b}.ok{border-color:#315e43}
@media(max-width:430px){body{padding:11px}.tableRow{grid-template-columns:52px 1fr 1fr 1fr 28px}.tableRow .hideMob{display:none}.grid,.details{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API="https://www.okx.com";
const state={universe:[],selected:null,tf:"5m",candles:{},detail:null};

const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>Number.isFinite(Number(n))?Number(n).toLocaleString("fr-FR",{maximumFractionDigits:d}):"—";
const pct=(n,d=2)=>(Number.isFinite(Number(n))?(n>=0?"+":"")+Number(n).toFixed(d)+"%":"—");
async function get(path){
  const r=await fetch(API+path,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json();
  if(j.code!=="0") throw new Error(j.msg||"OKX");
  return j.data;
}
function scoreColor(s){return s>=72?"good":s>=52?"warn":"bad"}
function activityText(s){return s>=78?"Activité inhabituelle":s>=62?"Activité élevée":s>=45?"Flux normal":"Activité faible"}

async function loadUniverse(){
  const tickers=await get("/api/v5/market/tickers?instType=SWAP");
  const usdt=tickers.filter(x=>x.instId.endsWith("-USDT-SWAP") && Number(x.last)>0 && Number(x.volCcy24h)>0);
  usdt.sort((a,b)=>Number(b.volCcy24h)-Number(a.volCcy24h));
  const base=usdt.slice(0,35);
  const enriched=await Promise.all(base.map(async x=>{
    let oi=0, funding=0;
    try{
      const d=await get("/api/v5/public/open-interest?instType=SWAP&instId="+encodeURIComponent(x.instId));
      oi=Number(d[0]?.oiUsd||0);
    }catch(e){}
    try{
      const d=await get("/api/v5/public/funding-rate?instId="+encodeURIComponent(x.instId));
      funding=Number(d[0]?.fundingRate||0)*100;
    }catch(e){}
    const change=Number(x.sodUtc0||x.change24h||0);
    const p=Number(x.last), v=Number(x.volCcy24h);
    const raw=Math.min(100,Math.max(0,45 + Math.min(25,Math.log10(v+1)*4) + Math.min(20,Math.abs(change)*3) + (oi>0?10:0)));
    return {...x,oi,funding,score:Math.round(raw),change,p,v};
  }));
  enriched.sort((a,b)=>b.score-a.score);
  state.universe=enriched;
}

function home(){
  const rows=state.universe.map((x,i)=>`
    <div class="tableRow" onclick="openDetail('${x.instId}')">
      <b>${x.instId.replace("-USDT-SWAP","")}</b>
      <div><span class="mut">Prix</span><br><b>${fmt(Number(x.last), x.last<1?5:2)}</b></div>
      <div><span class="mut">24h</span><br><b class="${Number(x.change)>=0?'good':'bad'}">${pct(Number(x.change))}</b></div>
      <div><span class="mut">OI</span><br><b>${x.oi?fmt(x.oi/1e6,1)+" M$":"—"}</b></div>
      <div><span class="mut">Radar</span><br><b class="${scoreColor(x.score)}">${x.score}</b></div>
      <div class="arrow">›</div>
    </div>`).join("");
  $("app").innerHTML=`
    <h1>🏦 Institutional Radar <span class="pill">V3</span></h1>
    <div class="sub">Scan dynamique OKX • activité, OI, volume, funding, liquidations et lecture des bougies.</div>
    <div class="top"><button class="btn" onclick="refresh()">↻ Scanner</button><span class="pill" id="status">Chargement…</span><span class="pill">${new Date().toLocaleTimeString("fr-FR")}</span></div>

    <div class="section">🔥 Cryptos détectées</div>
    <div class="card">
      <div class="sub">Le radar ne fixe plus une liste de cryptos : il trie automatiquement les contrats USDT qui présentent le plus d'activité selon nos critères.</div>
      ${rows||"<div class='sub'>Aucune donnée.</div>"}
    </div>

    <div class="section">🧠 Comment lire le radar</div>
    <div class="card">
      <div class="signal"><div class="signalTitle">1. Un chiffre seul ne donne pas une direction</div><div class="signalText">320 M$ d'OI peut être énorme pour une petite crypto et banal pour BTC. Le radar compare donc l'OI à l'activité de l'actif et, dans l'analyse détaillée, à son historique.</div></div>
      <div class="signal"><div class="signalTitle">2. On cherche la confluence</div><div class="signalText">Prix + OI + volume + funding + liquidations + structure des bougies. Plus les éléments racontent la même histoire, plus la configuration est cohérente.</div></div>
      <div class="signal"><div class="signalTitle">3. Le radar sépare scénario et déclencheur</div><div class="signalText">Une configuration peut être intéressante sans que le timing soit bon. La couche bougies cherche ensuite une confirmation sur 1m/5m/15m.</div></div>
      <div class="click">› Clique sur une crypto pour aller jusqu'au timing.</div>
    </div>
    <div class="sub">⚠️ Ce radar produit une lecture de marché, pas une certitude. Le niveau « terrain » est une analyse de configuration, pas une garantie de résultat.</div>`;
  $("status").textContent=`${state.universe.length} contrats scannés`;
}

async function getCandles(instId,bar="5m",limit=80){
  const d=await get("/api/v5/market/candles?instId="+encodeURIComponent(instId)+"&bar="+bar+"&limit="+limit);
  return d.map(a=>({t:+a[0],o:+a[1],h:+a[2],l:+a[3],c:+a[4],v:+a[5]})).reverse();
}
function candleRead(cs){
  if(cs.length<5)return {score:50,patterns:[],structure:"Données insuffisantes",last:null};
  const a=cs[cs.length-1],p=cs[cs.length-2], body=Math.abs(a.c-a.o), range=a.h-a.l||1;
  const upper=a.h-Math.max(a.o,a.c), lower=Math.min(a.o,a.c)-a.l;
  const patterns=[];
  if(body/range<.18)patterns.push("doji / hésitation");
  if(lower>body*2 && upper<body)patterns.push("rejet bas");
  if(upper>body*2 && lower<body)patterns.push("rejet haut");
  if(a.c>a.o && p.c<p.o && a.c>=p.o && a.o<=p.c)patterns.push("englobante haussière");
  if(a.c<a.o && p.c>p.o && a.o>=p.c && a.c<=p.o)patterns.push("englobante baissière");
  const highs=cs.slice(-8).map(x=>x.h), lows=cs.slice(-8).map(x=>x.l);
  const risingHigh=highs[highs.length-1]>highs[0], risingLow=lows[lows.length-1]>lows[0];
  let structure=risingHigh&&risingLow?"HH/HL — structure haussière":(!risingHigh&&!risingLow?"LH/LL — structure baissière":"structure mixte");
  let score=50;
  if(risingHigh&&risingLow)score+=12;if(!risingHigh&&!risingLow)score-=12;
  if(a.c>a.o)score+=5;else score-=5;
  if(lower>body*2)score+=6;if(upper>body*2)score-=6;
  return {score:Math.max(0,Math.min(100,score)),patterns,structure,last:a,body,range,upper,lower};
}
function drawLine(canvas,cs,field,label){
  const ctx=canvas.getContext("2d"), W=canvas.clientWidth*devicePixelRatio,H=canvas.clientHeight*devicePixelRatio;
  canvas.width=W;canvas.height=H;ctx.clearRect(0,0,W,H);ctx.font=`${12*devicePixelRatio}px Arial`;
  const vals=cs.map(x=>field==="price"?x.c:x.v), min=Math.min(...vals),max=Math.max(...vals), pad=(max-min||1)*.12;
  const lo=min-pad,hi=max+pad; const x=i=>20*devicePixelRatio+i*(W-35*devicePixelRatio)/(vals.length-1); const y=v=>H-22*devicePixelRatio-(v-lo)*(H-42*devicePixelRatio)/(hi-lo);
  ctx.strokeStyle="#263241";ctx.lineWidth=1*devicePixelRatio;
  for(let i=0;i<4;i++){const yy=12*devicePixelRatio+i*(H-34*devicePixelRatio)/3;ctx.beginPath();ctx.moveTo(20*devicePixelRatio,yy);ctx.lineTo(W-10*devicePixelRatio,yy);ctx.stroke();}
  ctx.strokeStyle="#58a6ff";ctx.lineWidth=2.4*devicePixelRatio;ctx.beginPath();
  vals.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.stroke();
  const im=vals.indexOf(max), ii=vals.indexOf(min), last=vals.length-1;
  [[im,max,"#35c759","MAX"],[ii,min,"#ffb020","MIN"],[last,vals[last],"#54d7e5","ACTUEL"]].forEach(([i,v,col,txt])=>{
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x(i),y(v),4*devicePixelRatio,0,Math.PI*2);ctx.fill();
    ctx.fillText(txt+" "+fmt(v,field==="price"?(v<1?5:2):2),Math.max(22*devicePixelRatio,x(i)-25*devicePixelRatio),Math.max(14*devicePixelRatio,y(v)-8*devicePixelRatio));
  });
  ctx.fillStyle="#8f9aaa";ctx.fillText(fmt(min,field==="price"?(min<1?5:2):2),20*devicePixelRatio,H-5*devicePixelRatio);
  ctx.fillText(fmt(max,field==="price"?(max<1?5:2):2),W-90*devicePixelRatio,14*devicePixelRatio);
}
function scenario(detail,cr){
  const oi=cr.oi, ch=Number(cr.change), fund=Number(cr.funding), vol=Number(cr.volCcy24h);
  const c5=detail.c5, c15=detail.c15, r5=candleRead(c5),r15=candleRead(c15);
  let s=50, reasons=[];
  if(ch>1){s+=10;reasons.push("prix en progression")}else if(ch<-1){s-=10;reasons.push("prix sous pression")}
  if(oi>0){s+=5;reasons.push("OI disponible")}
  if(Math.abs(fund)<0.02){s+=5;reasons.push("funding encore modéré")}else if(Math.abs(fund)>0.08){s-=8;reasons.push("funding tendu")}
  if(r5.score>62){s+=10;reasons.push("structure 5m constructive")}else if(r5.score<40){s-=10;reasons.push("structure 5m fragile")}
  if(r15.score>62){s+=8;reasons.push("structure 15m constructive")}else if(r15.score<40){s-=8;reasons.push("structure 15m fragile")}
  s=Math.max(0,Math.min(100,Math.round(s)));
  let title=s>=72?"🟢 Terrain favorable à surveiller":s>=52?"🟠 Terrain mixte / attendre une confirmation":"🔴 Terrain défavorable / danger accru";
  let timing=s>=72&&r5.score>=62?"Chercher une confirmation 5m (cassure/retest + volume) plutôt que poursuivre une bougie déjà étendue.":s>=52?"Attendre que la structure 5m et le volume donnent une confirmation claire.":"Ne pas forcer l'entrée : attendre une amélioration de structure et de participation.";
  return {s,title,reasons,timing};
}
async function openDetail(instId){
  const cr=state.universe.find(x=>x.instId===instId); if(!cr)return;
  state.selected=instId; state.tf="5m";
  $("app").innerHTML=`<div class="top"><button class="btn btn2" onclick="home()">← Radar</button><span class="pill">Analyse multi-couche</span></div><div class="section">Chargement de ${instId.replace("-USDT-SWAP","")}…</div>`;
  try{
    const [c1,c5,c15,c60]=await Promise.all([getCandles(instId,"1m",60),getCandles(instId,"5m",80),getCandles(instId,"15m",80),getCandles(instId,"1H",60)]);
    const detail={c1,c5,c15,c60};state.detail=detail; renderDetail(cr,detail);
  }catch(e){$("app").innerHTML+=`<div class="card">Erreur de données : ${e.message}</div>`}
}
function renderDetail(cr,d){
  const c5=candleRead(d.c5),c15=candleRead(d.c15),c1=candleRead(d.c1),c60=candleRead(d.c60);
  const sc=scenario(d,cr), p=Number(cr.last);
  $("app").innerHTML=`
  <div class="detailTop"><button class="btn btn2" onclick="home()">← Radar</button><div><h1>${cr.instId.replace("-USDT-SWAP","")}</h1><div class="sub">Analyse détaillée • OKX • bougies + dérivés</div></div></div>
  <div class="grid">
    <div class="kpi"><span>Prix</span><b>${fmt(p,p<1?5:2)} USDT</b></div>
    <div class="kpi"><span>Open Interest</span><b>${cr.oi?fmt(cr.oi/1e6,1)+" M$":"—"}</b></div>
    <div class="kpi"><span>Funding</span><b class="${Math.abs(cr.funding)>0.08?'warn':'good'}">${pct(cr.funding,3)}</b></div>
    <div class="kpi"><span>Radar</span><b class="${scoreColor(sc.s)}">${sc.s}/100</b></div>
  </div>

  <div class="card">
    <div class="signal ${sc.s>=72?'ok':sc.s<52?'danger':''}">
      <div class="signalTitle">${sc.title}</div>
      <div class="signalText">${sc.reasons.join(" • ")}.</div>
      <div class="bar"><div class="fill" style="width:${sc.s}%"></div></div>
    </div>
    <div class="signal"><div class="signalTitle">🎯 Timing subjectif</div><div class="signalText">${sc.timing}</div></div>
  </div>

  <div class="section">🧩 Lecture des indicateurs</div>
  <div class="card">
    <div class="row"><span>OI ${cr.oi?fmt(cr.oi/1e6,1)+" M$":"—"}</span><b>${cr.oi?"importance relative à surveiller":"donnée indisponible"}</b></div>
    <div class="signal"><div class="signalTitle">Pourquoi le montant OI ne suffit pas</div><div class="signalText">Le radar ne considère pas « 340 M$ = positif ». Un OI élevé signifie surtout beaucoup de positions ouvertes. Sa direction et sa relation au prix/volume sont déterminantes.</div></div>
    <div class="row"><span>Volume 24h</span><b>${fmt(cr.volCcy24h/1e6,1)} M$</b></div>
    <div class="row"><span>Momentum 24h</span><b class="${Number(cr.change)>=0?'good':'bad'}">${pct(Number(cr.change))}</b></div>
    <div class="row"><span>Funding</span><b>${pct(cr.funding,3)}</b></div>
  </div>

  <div class="section">🕯️ Confluence des bougies</div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="showTF('1m')">1m</button><button class="tab" onclick="showTF('5m')">5m</button><button class="tab" onclick="showTF('15m')">15m</button><button class="tab" onclick="showTF('1H')">1H</button>
    </div>
    <div id="candleInfo"></div>
  </div>

  <div class="card">
    <div class="chartHead"><div><div class="chartTitle">Prix — dernière période</div><div class="chartSub">Repères automatiques MAX / MIN / ACTUEL</div></div></div>
    <canvas id="priceChart"></canvas>
  </div>
  <div class="card">
    <div class="chartHead"><div><div class="chartTitle">Volume</div><div class="chartSub">Pics de participation visibles</div></div></div>
    <canvas id="volChart"></canvas>
  </div>

  <div class="section">🧠 Mon analyse</div>
  <div class="card">
    <div class="signal"><div class="signalTitle">Lecture actuelle</div><div class="signalText">${sc.title}. Le radar combine contexte dérivé et structure des prix ; ce n'est pas une preuve de présence institutionnelle.</div></div>
    <div class="signal"><div class="signalTitle">⚠️ Invalidation</div><div class="signalText">Une perte de structure sur 5m/15m, un volume qui disparaît ou une accélération du funding peuvent dégrader la lecture. Une configuration favorable n'élimine jamais le risque.</div></div>
  </div>
  <div class="sub">⚠️ Les niveaux et scénarios sont analytiques et subjectifs. Ils ne constituent pas une recommandation financière ni une garantie d'entrée gagnante.</div>`;
  showTF("5m");
  setTimeout(()=>{drawLine($("priceChart"),d.c5,"price","Prix");drawLine($("volChart"),d.c5,"vol","Volume")},50);
}
function showTF(tf){
  state.tf=tf; const d=state.detail; const map={"1m":d.c1,"5m":d.c5,"15m":d.c15,"1H":d.c60};const cs=map[tf],r=candleRead(cs);
  const last=r.last; const pat=r.patterns.length?r.patterns.join(" • "):"aucun pattern dominant détecté";
  $("candleInfo").innerHTML=`<div class="details">
    <div class="box">Structure<b class="${r.score>=62?'good':r.score<40?'bad':'warn'}">${r.structure}</b></div>
    <div class="box">Lecture bougie<b>${pat}</b></div>
    <div class="box">Score bougies<b>${r.score}/100</b></div>
    <div class="box">Dernière clôture<b>${last?fmt(last.c,last.c<1?5:2):"—"}</b></div>
  </div>
  <div class="signal"><div class="signalTitle">Comment lire cette unité</div><div class="signalText">${r.score>=62?"La structure est constructive, mais elle doit être confirmée par le volume et le contexte OI.":r.score<40?"La structure est fragile : une entrée immédiate demande davantage de confirmation.":"La structure est mixte : attendre une bougie de confirmation plutôt que deviner la direction."}</div></div>`;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.textContent===tf));
  setTimeout(()=>{drawLine($("priceChart"),cs,"price","Prix");drawLine($("volChart"),cs,"vol","Volume")},20);
}
async function refresh(){
  $("status")?.replaceChildren(document.createTextNode("Scan en cours…"));
  try{await loadUniverse();home();}catch(e){$("app").innerHTML=`<div class="card"><b>Erreur</b><div class="sub">${e.message}</div><button class="btn" onclick="refresh()">Réessayer</button></div>`}
}
refresh();
</script>
</body>
</html>
